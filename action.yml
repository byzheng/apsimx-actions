name: 'Compile APSIMX'
description: 'Clone, cache, and build APSIMX with persistent working tree'

runs:
  using: "composite"
  steps:
    # 📍 Use workspace, not RUNNER_TEMP
    - name: Set APSIMX directory
      run: echo "APSIMX_DIR=$GITHUB_WORKSPACE/apsimx" >> $GITHUB_ENV
      shell: bash

    # ✅ Cache NuGet
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    # ✅ Cache APSIMX repo + build outputs
    - name: Restore APSIMX cache
      id: cache-apsimx
      uses: actions/cache@v4
      with:
        path: ${{ env.APSIMX_DIR }}
        key: apsimx-${{ inputs.repo-url }}-${{ inputs.branch }}-
        restore-keys: |
          apsimx-${{ inputs.repo-url }}-${{ inputs.branch }}-

    # 📥 Clone if cache miss
    - name: Clone APSIMX
      if: steps.cache-apsimx.outputs.cache-hit != 'true'
      run: |
        git clone --branch ${{ inputs.branch }} https://github.com/${{ inputs.repo-url }}.git "$GITHUB_WORKSPACE"
        cd "$APSIMX_DIR"
      shell: bash

    # 🔄 Pull updates if cache hit
    - name: Update APSIMX
      if: steps.cache-apsimx.outputs.cache-hit == 'true'
      run: |
        cd "$APSIMX_DIR"
        git reset --hard
        git pull
      shell: bash

    # 🏗 Build APSIMX
    - name: Build APSIMX
      run: dotnet build "$APSIMX_DIR/Models/Models.csproj" -c Release
      shell: bash

    # ➕ Add Models to PATH
    - name: Add Models to PATH
      run: echo "$APSIMX_DIR/bin/Release/net8.0" >> $GITHUB_PATH
      shell: bash
