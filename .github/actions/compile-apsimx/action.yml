name: 'Compile APSIMX'
description: 'Checks out and compiles APSIM Next Generation'
inputs:
  repo-url:
    description: 'Git URL of APSIMX source'
    required: false
    default: 'APSIMInitiative/ApsimX'
  branch:
    description: 'Branch to checkout'
    required: false
    default: 'master'
runs:
  using: "composite"
  steps:
    - name: Clone APSIMX source
      run: git clone --branch ${{ inputs.branch }} --depth 1 https://github.com/${{ inputs.repo-url }}.git apsimx
      shell: bash

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    
    - name: Build APSIMX
      run: cd apsimx && dotnet build Models/Models.csproj -c Release
      shell: bash

    - name: Add Models to PATH
      run: echo "$(pwd)/apsimx/bin/Release/net8.0" >> $GITHUB_PATH
      shell: bash
    

    - name: Run Wheat example
      run: Models apsimx/Examples/Wheat.apsimx
      shell: bash

    - name: Check Wheat.db exists
      run: |
        if [ -f apsimx/Examples/Wheat.db ]; then
          echo "Wheat.db exists."
        else
          echo "Wheat.db does not exist."
          exit 1
        fi
      shell: bash
    