name: 'Compile APSIMX'
description: 'Build APSIM Next Generation in isolated temp directory with caching'

inputs:
  repo-url:
    description: 'GitHub repo of APSIMX (org/repo)'
    required: false
    default: 'APSIMInitiative/ApsimX'

  branch:
    description: 'Branch to checkout'
    required: false
    default: 'master'

  run-test-example:
    description: 'Run Wheat.apsimx to verify build'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set env vars for source and binary dirs
      run: |
        echo "SRC_DIR=$RUNNER_TEMP/apsimx-src" >> $GITHUB_ENV
        echo "BIN_DIR=$RUNNER_TEMP/apsimx-bin" >> $GITHUB_ENV
      shell: bash

    # 🧠 Cache NuGet packages
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    # 📦 Cache APSIMX source
    - name: Restore APSIMX source from cache
      id: cache-apsimx-src
      uses: actions/cache@v4
      with:
        path: ${{ env.SRC_DIR }}
        key: apsimx-src-${{ inputs.repo-url }}-${{ inputs.branch }}

    - name: Clone APSIMX source (if cache miss)
      if: steps.cache-apsimx-src.outputs.cache-hit != 'true'
      run: |
        rm -rf "$SRC_DIR"
        git clone --branch ${{ inputs.branch }} --depth 1 https://github.com/${{ inputs.repo-url }}.git "$SRC_DIR"
      shell: bash

    # 🔨 Cache compiled binaries
    - name: Restore APSIMX binaries from cache
      id: cache-apsimx-bin
      uses: actions/cache@v4
      with:
        path: ${{ env.BIN_DIR }}
        key: apsimx-bin-${{ inputs.repo-url }}-${{ inputs.branch }}-${{ hashFiles('${{ env.SRC_DIR }}/Models/**/*.cs') }}
        restore-keys: |
          apsimx-bin-${{ inputs.repo-url }}-${{ inputs.branch }}-

    - name: Build APSIMX (if not cached)
      if: steps.cache-apsimx-bin.outputs.cache-hit != 'true'
      run: |
        dotnet build "$SRC_DIR/Models/Models.csproj" -c Release -o "$BIN_DIR"
      shell: bash

    # ✅ Add built Models to PATH
    - name: Add APSIMX Models to PATH
      run: echo "$BIN_DIR" >> $GITHUB_PATH
      shell: bash

    # 🧪 Optionally run example model
    - name: Run test example model
      if: ${{ inputs.run-test-example == 'true' || github.repository == 'APSIMInitiative/ApsimX' }}
      run: Models "$SRC_DIR/Examples/Wheat.apsimx"
      shell: bash

    - name: Check Wheat.db exists
      if: ${{ inputs.run-test-example == 'true' || github.repository == 'APSIMInitiative/ApsimX' }}
      run: |
        if [ -f "$SRC_DIR/Examples/Wheat.db" ]; then
          echo "✅ Wheat.db exists."
        else
          echo "❌ Wheat.db does not exist."
          exit 1
        fi
      shell: bash
